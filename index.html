<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  }

  }
  .global-bar-track {

    overflow: hidden;
    position: relative;
  }
  .global-bar-fill {

    border-radius: 4px;

  .global-bar-labels {

    margin: 7px auto 0;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
  }

  .wrap { max-width: 480px; margin: 0 auto; padding: 8px 16px 60px; }

  .voice { font-style: italic; }

  .level-section { margin-bottom: 8px; }
  .level-section.hidden { display: none; }

  .level-title {
    font-size: 24px;
    font-weight: 500;
    margin-top: 18px;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .level-sub {
    font-size: 13.5px;
    color: #888888;
    margin-bottom: 22px;
    line-height: 1.5;
  }
  .level-sub .count {
    color: #111111;
    font-style: normal;
    font-weight: 700;
  }

  .level-dots {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #e0e0e0;
    transition: background 0.3s ease, width 0.3s ease;
  }
  .dot.done { background: #85B7EB; }
  .dot.current { background: #111111; width: 16px; border-radius: 3px; }

  .task {
    padding: 20px 16px;
    margin-bottom: 12px;
    background: #fafafa;
    border-radius: 10px;
    opacity: 0;
    transform: translateY(6px);
    animation: taskIn 0.25s ease forwards;
  }
  @keyframes taskIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .task-sentence {
    font-size: 17px;
    line-height: 1.55;
    color: #111111;
    margin-bottom: 14px;
    font-weight: 400;
  }
  .task-sentence .gap {
    display: inline-block;
    min-width: 56px;
    text-align: center;
    border-bottom: 2px solid #999999;
    color: transparent;
    user-select: none;
  }
  .task-sentence .gap.filled-correct {
    color: #1e7a45;
    border-bottom-color: #1e7a45;
    font-weight: 600;
  }
  .task-sentence .gap.filled-wrong {
    color: #b23a3a;
    border-bottom-color: #b23a3a;
    font-weight: 600;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .opt-btn {
    border: 1.5px solid #d5d5d5;
    background: #ffffff;
    padding: 11px 8px;
    font-size: 15px;
    font-family: inherit;
    color: #111111;
    cursor: pointer;
    border-radius: 8px;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .opt-btn:active { transform: scale(0.98); }
  .opt-btn.correct {
    background: #E3F5E9;
    border-color: #5CB584;
    color: #1e7a45;
    font-weight: 600;
  }
  .opt-btn.wrong {
    background: #FBE4E4;
    border-color: #D64545;
    color: #b23a3a;
    font-weight: 600;
  }
  .opt-btn.disabled { pointer-events: none; }
  .opt-btn.dimmed { opacity: 0.4; }

  .hint-btn {
    background: none;
    border: none;
    color: #7a9dbf;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 0;
    font-family: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .hint-text {
    font-size: 13px;
    color: #777777;
    margin-top: 6px;
    line-height: 1.5;
    display: none;
  }
  .hint-text.shown { display: block; }

  .explanation {
    font-size: 13.5px;
    color: #555555;
    margin-top: 12px;
    line-height: 1.55;
    padding-left: 10px;
    border-left: 2px solid #85B7EB;
    display: none;
  }
  .explanation.shown {
    display: block;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .story-text {
    background: #fafafa;
    border-radius: 10px;
    padding: 22px 18px;
    font-size: 16.5px;
    line-height: 1.75;
    color: #111111;
    margin-bottom: 14px;
  }
  .story-text .filled-correct { color: #1e7a45; font-weight: 600; }
  .story-text .filled-wrong { color: #b23a3a; font-weight: 600; }
  .story-text .filled-wrong-strike {
    color: #b23a3a;
    font-weight: 600;
    text-decoration: line-through;
    text-decoration-color: #b23a3a;
    opacity: 0.7;
  }
  .story-text .filled-correction {
    color: #2b6cb0;
    font-weight: 600;
  }

  .inline-task {
    display: block;
    padding: 20px 16px;
    background: #ffffff;
    border-radius: 10px;
    border: 1.5px solid #111111;
  }
  .inline-task.answered { opacity: 0.6; transition: opacity 0.3s ease; }
  .inline-task .options { margin-bottom: 10px; }
  .inline-task .hint-text { margin-bottom: 10px; }

  .story-blank-placeholder {
    display: inline-block;
    min-width: 90px;
    border-bottom: 2px solid #999999;
    text-align: center;
  }

  .level-complete {
    text-align: center;
    padding: 40px 20px;
    background: #111111;
    margin: 20px -16px 0;
    opacity: 0;
    transform: scale(0.96);
    animation: completeIn 0.4s ease forwards;
  }
  @keyframes completeIn {
    to { opacity: 1; transform: scale(1); }
  }

  .star-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 0 auto 12px;
    flex-wrap: wrap;
    max-width: 340px;
  }
  .star-row svg {
    width: 32px;
    height: 32px;
    opacity: 0;
    transform: scale(0);
  }
  .star-row svg.pop {
    animation: starPop 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes starPop {
    0% { opacity: 0; transform: scale(0) rotate(-15deg); }
    60% { opacity: 1; transform: scale(1.25) rotate(8deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .score-caption {
    font-size: 16px;
    color: #85B7EB;
    font-weight: 700;
    margin-bottom: 30px;
  }

  .level-progress-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .level-progress-circle {
    width: 22px;
    height: 22px;
    border: 1.5px solid #555555;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #888888;
    font-weight: 600;
  }
  .level-progress-circle.filled {
    background: #f0f0f0;
    border-color: #f0f0f0;
    color: #111111;
  }
  .level-progress-line { width: 10px; height: 1px; background: #444444; }
  .level-progress-line.filled { background: #e8e8e8; }
  .level-progress-caption { font-size: 11px; color: #666666; margin-bottom: 28px; }
  .level-complete-sub {
    font-size: 13px;
    color: #ffffff;
    opacity: 0.65;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .next-level-btn {
    background: #ffffff;
    color: #111111;
    border: none;
    padding: 13px 26px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
  }
  .next-level-btn:active { transform: scale(0.98); }

  .cta-placeholder {
    text-align: center;
    padding: 50px 20px;
    background: #111111;
    margin: 20px -16px 0;
  }
  .cta-placeholder p {
    color: #ffffff;
    opacity: 0.5;
    font-size: 13px;
    font-style: italic;
  }

  .cta-wrapper {
    padding-top: 8px;
  }
  .final-result-title {
    font-size: 26px;
    font-weight: 600;
    color: #111111;
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }

  .cta-block {
    padding: 40px 20px 36px;
    background: #111111;
    margin: 20px -16px 0;
    text-align: center;
  }
  .cta-stars-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px;
    max-width: 300px;
    margin: 0 auto 8px;
  }
  .cta-stars-caption {
    color: #85B7EB;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .cta-feedback-card {
    background: #f4f4f4;
    border-radius: 0;
    padding: 18px 16px;
    margin-bottom: 28px;
    text-align: left;
  }
  .cta-feedback-card p {
    color: #222222;
    font-size: 14px;
    line-height: 1.6;
  }
  .cta-feedback-card p:first-child { margin-bottom: 10px; }
  .cta-invite-card {
    padding-top: 4px;
    text-align: left;
  }
  .cta-invite {
    color: #ffffff;
    font-size: 14.5px;
    line-height: 1.6;
    margin-bottom: 22px;
  }
  .cta-btn {
    display: inline-block;
    background: #ffffff;
    color: #111111;
    text-decoration: none;
    padding: 14px 30px;
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 30px;
  }
  .cta-btn:active { transform: scale(0.98); }
  .cta-bonus {
    border-top: 1px solid #333333;
    padding-top: 22px;
    margin-bottom: 26px;
  }
  .cta-bonus-text {
    color: #ffffff;
    opacity: 0.7;
    font-size: 13px;
    line-height: 1.55;
    margin-bottom: 12px;
    text-align: left;
  }
  .cta-code {
    display: inline-block;
    background: transparent;
    color: #ffffff;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 2px;
    padding: 10px 22px;
    border: 1.5px dashed #666666;
  }
  .cta-brand {
    color: #666666;
    font-size: 11.5px;
    letter-spacing: 0.5px;
    font-style: italic;
    text-decoration: none;
    display: inline-block;
  }
  .cta-brand:active { opacity: 0.6; }
</style>
</head>

// ===== ОБЩИЕ ДАННЫЕ ПО ВСЕМ 5 УРОВНЯМ =====

        correct: "are going to",
        hint: "Это общее намерение на будущее — не согласованная дата и не спонтанное решение прямо сейчас.",
        explanation: "Правильный ответ — <b>are going to</b>. Общее намерение или план без жёсткой даты."
      }
    ]
  },
  {
    title: "Финальный уровень",
    subtitle: "Все времена сразу",
    isFinal: true,
    ctaTopic: "все времена сразу, в связном тексте",
    ctaTopicNom: "работа со всеми временами сразу, в связном тексте",
    tasks: [
      {
        before: "Hey! Sorry I",
        after: " so quiet lately, it's been a wild week.",
        options: ["am", "have been", "was", "were"],
        correct: "have been",
        hint: "Это состояние длится до сих пор, без точной даты, когда оно началось."
      },
      {
        before: "So, remember how I",
        after: " about maybe moving closer to the coast?",
        options: ["talk", "talked", "have talked", "am talking"],
        correct: "talked",
        hint: "Это ссылка на конкретный, уже случившийся разговор в прошлом."
      },
      {
        before: "Well, we",
        after: " it more seriously now.",
        options: ["think about", "are thinking about", "thought about", "will think about"],
        correct: "are thinking about",
        hint: "Ничего ещё не решено, только растущий интерес прямо сейчас."
      },
      {
        before: "Actually, we",
        after: " a house this Saturday, the agent already confirmed.",
        options: ["see", "are seeing", "saw", "are going to see"],
        correct: "are seeing",
        hint: "Дело уже согласовано с конкретной датой, агент подтвердил."
      },
      {
        before: "Meanwhile, work",
        after: " crazy this month.",
        options: ["is", "has been", "was", "is being"],
        correct: "has been",
        hint: "Месяц ещё не закончился, а состояние длится весь этот период."
      },
      {
        before: "I",
        after: " three deadlines already, and there's still one more waiting.",
        options: ["met", "have met", "meet", "am meeting"],
        correct: "have met",
        hint: "Нет точной даты, зато есть «already» — важен результат к сегодняшнему дню."
      },
      {
        before: "Oh, and funny thing, I",
        after: " my sister at the market yesterday completely by accident.",
        options: ["have run into", "ran into", "run into", "am running into"],
        correct: "ran into",
        hint: "Есть точная дата — yesterday."
      },
      {
        before: "Anyway, I",
        after: " call you properly this weekend, once things calm down a bit. Promise.",
        options: ["am going to", "will", "do", "am calling"],
        correct: "am going to",
        hint: "Это уже обдуманное намерение, не решение в последнюю секунду."
      }
    ]
  }
];

const TOTAL_LEVELS = LEVELS.length;
let currentLevel = 0;
let currentTask = 0;
let correctCount = 0;
const levelResults = []; // {correct, total} для каждого пройденного уровня

const mainWrap = document.getElementById('mainWrap');

function pluralCorrect(n) {
  const lastDigit = n % 10, lastTwo = n % 100;
  if (lastTwo >= 11 && lastTwo <= 14) return 'правильных';
  if (lastDigit === 1) return 'правильный';
  if (lastDigit >= 2 && lastDigit <= 4) return 'правильных';
  return 'правильных';
}
function pluralAnswers(n) {
  const lastDigit = n % 10, lastTwo = n % 100;
  if (lastTwo >= 11 && lastTwo <= 14) return 'ответов';
  if (lastDigit === 1) return 'ответ';
  if (lastDigit >= 2 && lastDigit <= 4) return 'ответа';
  return 'ответов';
}

function buildLevelProgressRow(current, total) {
  let html = '';
  for (let i = 1; i <= total; i++) {
    const filled = i <= current;
    html += `<div class="level-progress-circle${filled ? ' filled' : ''}">${i}</div>`;
    if (i < total) html += `<div class="level-progress-line${i < current ? ' filled' : ''}"></div>`;
  }
  return html;
}

function getResultMessage(levelIdx, correct, total) {
  const lvl = LEVELS[levelIdx];
  if (correct === total) return `С ${lvl.resultTopic} всё отлично. Дальше — ${lvl.nextTopic}.`;
  if (correct >= 3) return `С ${lvl.resultTopic} в целом разобрались. Дальше — ${lvl.nextTopic}.`;
  return `С ${lvl.resultTopic} пока непросто. Дальше — ${lvl.nextTopic}.`;
}

function updateGlobalBar() {
  const perLevel = 100 / TOTAL_LEVELS;
  const levelBase = currentLevel * perLevel;
  const withinLevel = (currentTask / LEVELS[currentLevel].tasks.length) * perLevel;
  const pct = Math.round(levelBase + withinLevel);
  document.getElementById('globalFill').style.width = pct + '%';
  document.getElementById('globalPct').textContent = pct + '%';
  document.getElementById('globalLevelLabel').textContent =
    currentLevel === TOTAL_LEVELS - 1 ? 'Финальный уровень' : `Уровень ${currentLevel + 1} из ${TOTAL_LEVELS}`;
}

function renderDots(container, total, done, current) {
  container.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < done ? ' done' : '') + (i === current ? ' current' : '');
    container.appendChild(d);
  }
}

// ===== ОБЫЧНЫЙ УРОВЕНЬ (1-4) =====

function renderRegularLevel(levelIdx) {
  const lvl = LEVELS[levelIdx];
  const section = document.createElement('div');
  section.className = 'level-section';
  section.id = 'level-section-' + levelIdx;
  section.innerHTML = `
    <div class="level-title">${lvl.title}</div>
    <div class="level-sub"><span class="voice">${lvl.subtitle}</span> <span class="count">· ${lvl.tasks.length} вопросов</span></div>
    <div class="level-dots" id="levelDots-${levelIdx}"></div>
    <div id="tasksContainer-${levelIdx}"></div>
  `;
  mainWrap.appendChild(section);

  currentTask = 0;
  renderTask(levelIdx, 0);
}

function renderTask(levelIdx, taskIdx) {
  const lvl = LEVELS[levelIdx];
  const t = lvl.tasks[taskIdx];
  const container = document.getElementById('tasksContainer-' + levelIdx);
  const taskEl = document.createElement('div');
  taskEl.className = 'task';
  taskEl.id = `task-${levelIdx}-${taskIdx}`;

  const sentenceHtml = `${t.sentence[0]} <span class="gap" id="gap-${levelIdx}-${taskIdx}">___</span> ${t.sentence[1]}`;

  taskEl.innerHTML = `
    <div class="task-sentence">${sentenceHtml}</div>
    <div class="options" id="options-${levelIdx}-${taskIdx}">
      ${t.options.map(opt => `<button class="opt-btn" data-val="${opt}">${opt}</button>`).join('')}
    </div>
    <button class="hint-btn" id="hintBtn-${levelIdx}-${taskIdx}">Показать подсказку</button>
    <div class="hint-text" id="hintText-${levelIdx}-${taskIdx}">${t.hint}</div>
    <div class="explanation" id="explanation-${levelIdx}-${taskIdx}">${t.explanation}</div>
  `;
  container.appendChild(taskEl);

  document.getElementById(`hintBtn-${levelIdx}-${taskIdx}`).addEventListener('click', () => {
    document.getElementById(`hintText-${levelIdx}-${taskIdx}`).classList.toggle('shown');
  });

  const optButtons = taskEl.querySelectorAll('.opt-btn');
  optButtons.forEach(btn => {
    btn.addEventListener('click', () => handleRegularAnswer(levelIdx, taskIdx, btn, optButtons));
  });

  renderDots(document.getElementById('levelDots-' + levelIdx), lvl.tasks.length, currentTask, currentTask);
  updateGlobalBar();
}

function handleRegularAnswer(levelIdx, taskIdx, btn, allButtons) {
  const lvl = LEVELS[levelIdx];
  const t = lvl.tasks[taskIdx];
  const val = btn.dataset.val;
  const isCorrect = val === t.correct;
  t._correctFlag = isCorrect;

  allButtons.forEach(b => {
    b.classList.add('disabled');
    if (b !== btn) b.classList.add('dimmed');
  });

  const gapEl = document.getElementById(`gap-${levelIdx}-${taskIdx}`);
  gapEl.textContent = val;

  if (isCorrect) {
    btn.classList.add('correct');
    gapEl.classList.add('filled-correct');
    correctCount++;
  } else {
    btn.classList.add('wrong');
    gapEl.classList.add('filled-wrong');
    document.getElementById(`explanation-${levelIdx}-${taskIdx}`).classList.add('shown');
  }
  document.getElementById(`hintBtn-${levelIdx}-${taskIdx}`).style.display = 'none';

  currentTask++;
  renderDots(document.getElementById('levelDots-' + levelIdx), lvl.tasks.length, currentTask, currentTask);
  updateGlobalBar();

  setTimeout(() => {
    if (currentTask < lvl.tasks.length) {
      renderTask(levelIdx, currentTask);
      document.getElementById(`task-${levelIdx}-${currentTask}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      showLevelComplete(levelIdx);
    }
  }, 500);
}

// ===== ФИНАЛЬНЫЙ УРОВЕНЬ (БОСС) =====

function renderFinalLevel(levelIdx) {
  const lvl = LEVELS[levelIdx];
  const section = document.createElement('div');
  section.className = 'level-section';
  section.id = 'level-section-' + levelIdx;
  section.innerHTML = `
    <div class="level-title">${lvl.title}</div>
    <div class="level-sub"><span class="voice">${lvl.subtitle}</span> <span class="count">· ${lvl.tasks.length} вопросов</span></div>
    <div class="level-dots" id="levelDots-${levelIdx}"></div>
    <div id="storyContainer-${levelIdx}"></div>
  `;
  mainWrap.appendChild(section);

  currentTask = 0;
  renderStory(levelIdx);
}

function renderStory(levelIdx) {
  const lvl = LEVELS[levelIdx];
  const storyContainer = document.getElementById('storyContainer-' + levelIdx);
  storyContainer.innerHTML = '';

  if (currentTask > 0) {
    const storyTextEl = document.createElement('div');
    storyTextEl.className = 'story-text';
    let html = '';
    for (let i = 0; i < currentTask; i++) {
      const t = lvl.tasks[i];
      if (t.wasCorrect) {
        html += `${t.before} <span class="filled-correct">${t.chosenVal}</span>${t.after} `;
      } else {
        html += `${t.before} <span class="filled-wrong-strike">${t.chosenVal}</span> <span class="filled-correction">${t.correct}</span>${t.after} `;
      }
    }
    storyTextEl.innerHTML = html;
    storyContainer.appendChild(storyTextEl);
  }

  if (currentTask < lvl.tasks.length) {
    const t = lvl.tasks[currentTask];
    const taskEl = document.createElement('div');
    taskEl.className = 'inline-task';
    taskEl.id = 'inline-task-' + currentTask;
    taskEl.innerHTML = `
      <div style="margin-bottom: 12px; font-weight: 400; font-size: 16.5px; line-height: 1.6;">${t.before} <span class="story-blank-placeholder" id="gap-final-${currentTask}">&nbsp;&nbsp;&nbsp;&nbsp;</span>${t.after}</div>
      <div class="options" id="options-final-${currentTask}">
        ${t.options.map(opt => `<button class="opt-btn" data-val="${opt}">${opt}</button>`).join('')}
      </div>
      <button class="hint-btn" id="hintBtn-final-${currentTask}">Показать подсказку</button>
      <div class="hint-text" id="hintText-final-${currentTask}">${t.hint}</div>
    `;
    storyContainer.appendChild(taskEl);

    document.getElementById('hintBtn-final-' + currentTask).addEventListener('click', () => {
      document.getElementById('hintText-final-' + currentTask).classList.toggle('shown');
    });

    const optButtons = taskEl.querySelectorAll('.opt-btn');
    optButtons.forEach(btn => {
      btn.addEventListener('click', () => handleFinalAnswer(levelIdx, btn, optButtons));
    });

    taskEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  renderDots(document.getElementById('levelDots-' + levelIdx), lvl.tasks.length, currentTask, currentTask);
  updateGlobalBar();
}

function handleFinalAnswer(levelIdx, btn, allButtons) {
  const lvl = LEVELS[levelIdx];
  const t = lvl.tasks[currentTask];
  const val = btn.dataset.val;
  const isCorrect = val === t.correct;

  allButtons.forEach(b => {
    b.classList.add('disabled');
    if (b !== btn) b.classList.add('dimmed');
  });

  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  document.getElementById('inline-task-' + currentTask).classList.add('answered');

  if (isCorrect) correctCount++;
  document.getElementById('hintBtn-final-' + currentTask).style.display = 'none';

  t.wasCorrect = isCorrect;
  t.chosenVal = val;

  setTimeout(() => {
    currentTask++;
    if (currentTask < lvl.tasks.length) {
      renderStory(levelIdx);
    } else {
      renderStory(levelIdx);
      levelResults[levelIdx] = { correct: correctCountForThisLevel(levelIdx), total: lvl.tasks.length };
      const storyContainer = document.getElementById('storyContainer-' + levelIdx);
      renderFinalCta(storyContainer);
    }
  }, 500);
}

// ===== ЭКРАН ЗАВЕРШЕНИЯ УРОВНЯ =====

function showLevelComplete(levelIdx) {
  const lvl = LEVELS[levelIdx];
  const container = document.getElementById('tasksContainer-' + levelIdx);

  const completeEl = document.createElement('div');
  completeEl.className = 'level-complete';

  const thisLevelCorrect = correctCountForThisLevel(levelIdx);

  const starsHtml = Array.from({length: thisLevelCorrect}).map(() =>
    `<svg viewBox="0 0 24 24" fill="#FFD84D" stroke="none"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7-5.4-4.7 7.1-.6z"/></svg>`
  ).join('');

  completeEl.innerHTML = `
    <div class="star-row" id="starRow-${levelIdx}">${starsHtml}</div>
    <div class="score-caption">${thisLevelCorrect} ${pluralCorrect(thisLevelCorrect)} ${pluralAnswers(thisLevelCorrect)} из ${lvl.tasks.length}</div>
    <div class="level-progress-row">${buildLevelProgressRow(levelIdx + 1, TOTAL_LEVELS)}</div>
    <div class="level-progress-caption">${levelIdx + 1} из ${TOTAL_LEVELS} уровней пройден</div>
    <div class="level-complete-sub">${getResultMessage(levelIdx, thisLevelCorrect, lvl.tasks.length)}</div>
    <button class="next-level-btn" id="nextLevelBtn-${levelIdx}">${levelIdx + 2 === TOTAL_LEVELS ? 'Финальный уровень' : 'Уровень ' + (levelIdx + 2)}</button>
  `;
  container.appendChild(completeEl);
  completeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

  setTimeout(() => {
    const starEls = document.getElementById('starRow-' + levelIdx).querySelectorAll('svg');
    starEls.forEach((s, i) => setTimeout(() => s.classList.add('pop'), i * 100));
  }, 300);

  levelResults[levelIdx] = { correct: thisLevelCorrect, total: lvl.tasks.length };

  document.getElementById(`nextLevelBtn-${levelIdx}`).addEventListener('click', () => {
    currentLevel++;
    currentTask = 0;
    startLevel(currentLevel);
    document.getElementById('level-section-' + currentLevel).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function renderFinalCta(container) {
  const totalStars = levelResults.reduce((sum, r) => sum + r.correct, 0);
  const maxStars = levelResults.reduce((sum, r) => sum + r.total, 0);
  const isPerfect = totalStars === maxStars;

  // находим самый сильный и самый слабый уровень по проценту верных с первой попытки
  let strongestIdx = 0, weakestIdx = 0;
  let strongestRatio = -1, weakestRatio = 2;
  levelResults.forEach((r, i) => {
    const ratio = r.correct / r.total;
    if (ratio > strongestRatio) { strongestRatio = ratio; strongestIdx = i; }
    if (ratio < weakestRatio) { weakestRatio = ratio; weakestIdx = i; }
  });

  const starsFullRows = Array.from({length: totalStars}).map(() =>
    `<svg viewBox="0 0 24 24" fill="#FFD84D" stroke="none" width="20" height="20"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7-5.4-4.7 7.1-.6z"/></svg>`
  ).join('');

  const feedbackHtml = isPerfect
    ? `<p style="margin-bottom: 10px;">С грамматикой у вас всё отлично.</p>
       <p>А как с уверенностью в разговоре, получается говорить так же легко, как отвечать на эти вопросы?</p>`
    : `<p style="margin-bottom: 10px;">Лучше всего вы чувствуете ${LEVELS[strongestIdx].ctaTopic}: здесь почти не было ошибок.</p>
       <p>Больше всего путаницы вызвала ${LEVELS[weakestIdx].ctaTopicNom}. Стоит закрепить отдельно.</p>`;

  const ctaEl = document.createElement('div');
  ctaEl.className = 'cta-wrapper';
  ctaEl.innerHTML = `
    <div class="final-result-title">Итоговый результат</div>
    <div class="cta-block">
      <div class="cta-stars-row">${starsFullRows}</div>
      <div class="cta-stars-caption">${totalStars} из ${maxStars} звёзд</div>
      <div class="cta-feedback-card">${feedbackHtml}</div>
      <div class="cta-invite-card">
        <div class="cta-invite">Если дошли до конца и хочется двигаться дальше, напишите мне в личку. Расскажу, как проходят занятия, и вместе посмотрим, что будет полезно именно вам.</div>
        <div style="text-align: center;">
          <a href="https://t.me/ArtemEnglishLessons" class="cta-btn" target="_blank" rel="noopener">Спросить про занятия</a>
        </div>
      </div>
      <div class="cta-bonus">
        <div class="cta-bonus-text">За то, что прошли тренажёр до конца, код на скидку 10% на ближайший поток курса. Действует 5 дней.</div>
        <div style="text-align: center;">
          <div class="cta-code">ВРЕМЕНА10</div>
        </div>
      </div>
      <a href="https://t.me/BezUchebnika" class="cta-brand" target="_blank" rel="noopener">BezUchebnika</a>
    </div>
  `;
  container.appendChild(ctaEl);
  ctaEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function correctCountForThisLevel(levelIdx) {
  return LEVELS[levelIdx].tasks.filter(t => {
    if (levelIdx === TOTAL_LEVELS - 1) return t.wasCorrect;
    return t._correctFlag;
  }).length;
}

function startLevel(levelIdx) {
  const lvl = LEVELS[levelIdx];
  if (lvl.isFinal) {
    renderFinalLevel(levelIdx);
  } else {
    renderRegularLevel(levelIdx);
  }
}

startLevel(0);
</script>
